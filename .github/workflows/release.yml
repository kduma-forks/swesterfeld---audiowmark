name: Portable release packages
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: portable-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: python3 scripts/release/metadata.py --github-output "$GITHUB_OUTPUT"
  native:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-musl-x86_64
            runner: ubuntu-24.04
          - target: linux-musl-aarch64
            runner: ubuntu-24.04-arm
          - target: win7-x86_64
            runner: windows-2022
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git patch autoconf automake libtool
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python
      - name: macOS build tools
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkgconf cmake ninja
      - name: Toolchain cache identity (Unix)
        if: runner.os != 'Windows'
        id: unix-toolchain
        shell: bash
        run: |
          if [[ "$TARGET" == linux-* ]]; then
            fingerprint=$(sha256sum scripts/release/images.lock.json | cut -d' ' -f1)
          else
            fingerprint=$(clang --version | shasum -a 256 | cut -d' ' -f1)
          fi
          echo "identity=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Toolchain cache identity (Windows)
        if: runner.os == 'Windows'
        id: windows-toolchain
        shell: msys2 {0}
        run: |
          echo "identity=$(gcc -dumpfullversion)-$(pacman -Q | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-deps-cache
        with:
          path: |
            .release/${{ matrix.target }}/prefix
            .release/${{ matrix.target }}/licenses
            .release/${{ matrix.target }}/downloads
          key: release-deps-v1-${{ matrix.target }}-${{ steps.unix-toolchain.outputs.identity || steps.windows-toolchain.outputs.identity }}-${{ hashFiles('scripts/release/dependencies.lock.json', 'scripts/release/images.lock.json', 'scripts/release/build-deps.sh', 'scripts/release/environment.sh', 'scripts/release/sources.py', 'scripts/release/patches/**') }}
      - name: Linux source build and extracted package smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/release/container-build.sh
          scripts/release/container-smoke.sh
      - name: macOS source build and extracted package smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RELEASE_WORK="$GITHUB_WORKSPACE/.release/$TARGET"
          scripts/release/build.sh
          python3 scripts/release/unpack.py --artifacts dist --cli .release/unpacked-cli
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python3 scripts/release/smoke.py --cli ".release/unpacked-cli/$TARGET/bin/audiowmark" --fixtures tests/data
      - name: Windows source build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export RELEASE_WORK="$PWD/.release/$TARGET"
          scripts/release/build.sh
      - name: Windows smoke outside MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/release/unpack.py --artifacts dist --cli .release/unpacked-cli
          python scripts/release/smoke.py --cli ".release/unpacked-cli/$env:TARGET/bin/audiowmark.exe" --fixtures tests/data
      - name: Cache completed source dependencies
        if: always() && steps.native-deps-cache.outputs.cache-hit != 'true' && steps.native-deps-cache.outputs.cache-primary-key != '' && hashFiles(format('.release/{0}/prefix/dependencies.lock.json', matrix.target)) != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .release/${{ matrix.target }}/prefix
            .release/${{ matrix.target }}/licenses
            .release/${{ matrix.target }}/downloads
          key: ${{ steps.native-deps-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  sources:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Complete corresponding source and licenses
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 scripts/release/source-bundle.py --version "$VERSION" --output dist --work .release/source-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-sources
          path: dist/*
          if-no-files-found: error
  verify-assets:
    needs: [metadata, native, sources]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-sources
          path: dist
      - name: Verify complete asset set and generate checksums
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 scripts/release/check-assets.py --version "$VERSION" --directory dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
  # This is the ONLY job with write permission. Published prereleases use the same gate.
  upload-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [metadata, verify-assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: dist
      - name: Upload verified assets to existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          gh release view "$RELEASE_TAG" --repo "$GH_REPO"
          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GH_REPO"
