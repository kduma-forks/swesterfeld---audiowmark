name: Release packages
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: portable-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      nuget: ${{ steps.version.outputs.nuget_version }}
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: python3 scripts/release/metadata.py --github-output "$GITHUB_OUTPUT"
  native:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        variant: [cli, full]
        target: [linux-musl-x86_64, linux-musl-aarch64, win7-x86_64, macos-x86_64, macos-aarch64]
        include:
          - target: linux-musl-x86_64
            runner: ubuntu-24.04
          - target: linux-musl-aarch64
            runner: ubuntu-24.04-arm
          - target: win7-x86_64
            runner: windows-2022
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15
          - target: linux-gnu-x86_64
            variant: cli
            runner: ubuntu-24.04
          - target: linux-gnu-aarch64
            variant: cli
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      TARGET: ${{ matrix.target }}
      VARIANT: ${{ matrix.variant }}
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git patch autoconf automake libtool nasm
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python
      - name: macOS build tools
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkgconf cmake ninja nasm
      - name: Toolchain cache identity (Unix)
        if: runner.os != 'Windows'
        id: unix-toolchain
        shell: bash
        run: |
          if [[ "$TARGET" == linux-* ]]; then
            fingerprint=$(sha256sum scripts/release/images.lock.json | cut -d' ' -f1)
          else
            fingerprint=$(clang --version | shasum -a 256 | cut -d' ' -f1)
          fi
          echo "identity=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Toolchain cache identity (Windows)
        if: runner.os == 'Windows'
        id: windows-toolchain
        shell: msys2 {0}
        run: |
          echo "identity=$(gcc -dumpfullversion)-$(pacman -Q | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-deps-cache
        with:
          path: |
            .release/${{ matrix.variant }}/${{ matrix.target }}/prefix
            .release/${{ matrix.variant }}/${{ matrix.target }}/licenses
            .release/${{ matrix.variant }}/${{ matrix.target }}/downloads
          key: release-deps-v3-${{ matrix.variant }}-${{ matrix.target }}-${{ steps.unix-toolchain.outputs.identity || steps.windows-toolchain.outputs.identity }}-${{ hashFiles('scripts/release/dependencies*.lock.json', 'scripts/release/images.lock.json', 'scripts/release/build-deps.sh', 'scripts/release/build-ffmpeg.sh', 'scripts/release/environment.sh', 'scripts/release/sources.py', 'scripts/release/patches/**') }}
      - name: Linux source build and extracted package smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/release/container-build.sh
          scripts/release/container-smoke.sh
      - name: macOS source build and extracted package smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RELEASE_WORK="$GITHUB_WORKSPACE/.release/$VARIANT/$TARGET"
          scripts/release/build.sh
          if [[ "$VARIANT" == full ]]; then
            python3 scripts/release/diagnose-macos-hls.py --bin-dir "$RELEASE_WORK/install/bin"
          fi
          python3 scripts/release/unpack.py --artifacts dist --native .release/native --variant "$VARIANT" --cli ".release/unpacked-$VARIANT"
          extra=(); if [[ "$VARIANT" == cli ]]; then extra=(--sdk ".release/native/$TARGET"); fi
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python3 scripts/release/smoke.py "${extra[@]}" --cli ".release/unpacked-$VARIANT/$TARGET/bin/audiowmark" --fixtures tests/data --variant "$VARIANT" --full-tests tests/full-test.py
      - name: Windows source build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export RELEASE_WORK="$PWD/.release/$VARIANT/$TARGET"
          scripts/release/build.sh
      - name: Windows smoke outside MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/release/unpack.py --artifacts dist --native .release/native --variant "$env:VARIANT" --cli ".release/unpacked-$env:VARIANT"
          $extra = @()
          if ($env:VARIANT -eq 'cli') { $extra = @('--sdk', ".release/native/$env:TARGET") }
          python scripts/release/smoke.py @extra --cli ".release/unpacked-$env:VARIANT/$env:TARGET/bin/audiowmark.exe" --fixtures tests/data --variant "$env:VARIANT" --full-tests tests/full-test.py
      - name: Cache completed source dependencies
        if: always() && steps.native-deps-cache.outputs.cache-hit != 'true' && steps.native-deps-cache.outputs.cache-primary-key != '' && hashFiles(format('.release/{0}/{1}/prefix/dependencies.lock.json', matrix.variant, matrix.target)) != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .release/${{ matrix.variant }}/${{ matrix.target }}/prefix
            .release/${{ matrix.variant }}/${{ matrix.target }}/licenses
            .release/${{ matrix.variant }}/${{ matrix.target }}/downloads
          key: ${{ steps.native-deps-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.variant }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  sources:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Complete corresponding source and licenses
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 scripts/release/source-bundle.py --version "$VERSION" --output dist --work .release/source-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-sources
          path: dist/*
          if-no-files-found: error
  documentation:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config g++ make \
            libsndfile1-dev libfftw3-dev libgcrypt20-dev libmpg123-dev libzita-resampler-dev \
            pandoc graphviz gnuplot-nox python3-pygraphviz python3-pandocfilters \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Build and verify standalone PDF and HTML
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.sha }}
          DOCS_BROWSER: google-chrome
        run: scripts/release/build-docs.sh
      - name: Release asset regression tests
        run: python3 scripts/release/test-assets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-documentation
          path: dist/*
          if-no-files-found: error
  language-packages:
    needs: [metadata, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.77.2
      - name: Package all seven SDKs
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          NUGET: ${{ needs.metadata.outputs.nuget }}
        run: |
          python3 scripts/release/unpack.py --artifacts artifacts --native native --cli cli
          python3 bindings/package.py --version "$VERSION" --nuget-version "$NUGET" --native-dir native --output-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: language-packages
          path: dist/*
          if-no-files-found: error
  consumers:
    needs: [metadata, native, language-packages]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-gnu-x86_64
            rid: linux-x64
            runner: ubuntu-24.04
          - target: linux-gnu-aarch64
            rid: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-musl-x86_64
            rid: linux-musl-x64
            runner: ubuntu-24.04
          - target: linux-musl-aarch64
            rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
          - target: win7-x86_64
            rid: win-x64
            runner: windows-2022
          - target: macos-x86_64
            rid: osx-x64
            runner: macos-15-intel
          - target: macos-aarch64
            rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.metadata.outputs.version }}
      NUGET: ${{ needs.metadata.outputs.nuget }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: language-packages
          path: dist
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        if: ${{ !startsWith(matrix.target, 'linux-musl-') }}
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        if: ${{ !startsWith(matrix.target, 'linux-musl-') }}
        with:
          toolchain: 1.77.2
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        if: runner.os == 'Windows'
        id: consumer-msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Restore packages
        shell: bash
        run: python3 scripts/release/unpack.py --artifacts artifacts --native native --cli cli
      - name: C, Rust and C# package consumers (Unix)
        if: runner.os != 'Windows' && !startsWith(matrix.target, 'linux-musl-')
        shell: bash
        run: |
          cli_target=${TARGET/linux-gnu-/linux-musl-}
          extra=(); if [[ -d "cli/$cli_target" ]]; then extra=(--cli "$PWD/cli/$cli_target/bin/audiowmark"); fi
          python3 bindings/test-packages.py --crate "dist/audiowmark-$VERSION.crate" --nuget-feed dist --version "$NUGET" --sdk "native/$TARGET" --rid "$RID" --work-dir "$RUNNER_TEMP/consumers" --framework net8.0 "${extra[@]}"
      - name: Alpine C, Rust and C# package consumers
        if: startsWith(matrix.target, 'linux-musl-')
        shell: bash
        run: scripts/release/container-consumers.sh
      - name: Windows consumers outside MSYS2 (including .NET Framework 4.8)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.consumer-msys2.outputs.msys2-location }}
        run: |
          $msysRoot = $env:MSYS2_ROOT.Replace('/', '\')
          $env:CC = Join-Path $msysRoot 'mingw64\bin\gcc.exe'
          if (!(Test-Path $env:CC)) { throw "MINGW64 compiler missing: $env:CC" }
          $env:PATH = (($env:PATH -split ';' | Where-Object { $_ -notmatch 'msys64' -and !$_.StartsWith($msysRoot, [StringComparison]::OrdinalIgnoreCase) }) -join ';')
          python bindings/test-packages.py --crate "dist/audiowmark-$env:VERSION.crate" --nuget-feed dist --version "$env:NUGET" --sdk "native/$env:TARGET" --rid "$env:RID" --work-dir "$env:RUNNER_TEMP/consumers" --framework net8.0 --cli "$env:GITHUB_WORKSPACE/cli/$env:TARGET/bin/audiowmark.exe"
  sanitizers:
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan-ubsan, tsan]
    env:
      TARGET: linux-gnu-x86_64
      VERSION: ${{ needs.metadata.outputs.version }}
      SANITIZER: ${{ matrix.sanitizer }}
      VALIDATION_ONLY: '1'
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y g++ autoconf automake libtool pkg-config cmake ninja-build gettext patch
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: sanitizer-deps-cache
        with:
          path: |
            .release/sanitizer-deps/prefix
            .release/sanitizer-deps/licenses
            .release/sanitizer-deps/downloads
          key: sanitizer-deps-ubuntu22-gcc11-${{ hashFiles('scripts/release/dependencies.lock.json', 'scripts/release/build-deps.sh', 'scripts/release/environment.sh', 'scripts/release/sources.py', 'scripts/release/patches/**') }}
      - name: Instrumented engine and parallel C ABI regression
        shell: bash
        run: |
          export RELEASE_WORK="$GITHUB_WORKSPACE/.release/sanitizer-deps"
          scripts/release/build.sh
      - name: Cache completed sanitizer dependencies
        if: always() && steps.sanitizer-deps-cache.outputs.cache-hit != 'true' && steps.sanitizer-deps-cache.outputs.cache-primary-key != '' && hashFiles('.release/sanitizer-deps/prefix/dependencies.lock.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .release/sanitizer-deps/prefix
            .release/sanitizer-deps/licenses
            .release/sanitizer-deps/downloads
          key: ${{ steps.sanitizer-deps-cache.outputs.cache-primary-key }}
  verify-assets:
    needs: [metadata, native, sources, documentation, language-packages, consumers, sanitizers]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: language-packages
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-sources
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-documentation
          path: dist
      - name: Verify complete asset set and generate checksums
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          NUGET: ${{ needs.metadata.outputs.nuget }}
        run: python3 scripts/release/check-assets.py --version "$VERSION" --nuget-version "$NUGET" --directory dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
  # This is the ONLY job with write permission. Published prereleases use the same gate.
  upload-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [metadata, verify-assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: dist
      - name: Upload verified assets to existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          gh release view "$RELEASE_TAG" --repo "$GH_REPO"
          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GH_REPO"
